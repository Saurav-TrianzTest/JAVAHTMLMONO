<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Operations Dashboard</title><link rel="stylesheet" href="assets/css/dashboard.css"><link rel="stylesheet" href="https://static.acme-corp.com/css/grid.css"><script>(function(){var xhr=new XMLHttpRequest();xhr.open('GET','/config/config.json',false);try{xhr.send(null);if(xhr.status===200){window.__ENV__=JSON.parse(xhr.responseText);}else{console.warn('[runtime-config] /config/config.json returned HTTP '+xhr.status+'. Falling back to empty config.');window.__ENV__=window.__ENV__||{}; }}catch(e){console.warn('[runtime-config] Failed to load /config/config.json:',e);window.__ENV__=window.__ENV__||{};}window.__ENV__.get=function(key,defaultValue){return(window.__ENV__[key]!==undefined&&window.__ENV__[key]!=='')?window.__ENV__[key]:(defaultValue!==undefined?defaultValue:'');};})();</script></head><body><header><img src="${CDN_BASE_URL}/assets/img/banner.png" alt="Banner"></header><main><a href="${ADMIN_CONSOLE_URL}/portal/admin">Open Admin Console</a><img src="images/icons/refresh.png" alt="refresh"><span id="report-timestamp" class="build-info"></span><script>(function(){var mode=(typeof TIMESTAMP_RENDER_MODE!=='undefined')?TIMESTAMP_RENDER_MODE:'client';if(mode==='client'){var el=document.getElementById('report-timestamp');if(el){el.textContent='Report generated: '+new Date().toISOString().replace('T',' ').substring(0,19)+' UTC';}}})();</script><script src="__CDN_BASE_URL__/js/telemetry.js"></script><script src="__CDN_BASE_URL__/js/charts.js"></script></main><script src="assets/js/dashboard.js"></script><noscript>JavaScript is required for live charts. Static report available at /reports/latest.</noscript></body></html>
