<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Legacy dashboard page migrated from on-prem IIS. Do not minify by hand. -->
    <title>Operations Dashboard</title>
    <!-- Base URL injected via Kubernetes ConfigMap; falls back to empty string for same-origin requests -->
    <meta name="telemetry-base-url" content="${TELEMETRY_BASE_URL}">
    <!--
        Runtime configuration injection point for containerised deployments.
        An EKS init container (or ConfigMap-backed entrypoint script) replaces
        the placeholder below with a populated window.__ENV__ object before the
        pod serves traffic, e.g.:
            window.__ENV__ = {
              "API_BASE_URL":        "${API_BASE_URL}",
              "ADMIN_CONSOLE_URL":   "${ADMIN_CONSOLE_URL}",
              "TELEMETRY_BASE_URL":  "${TELEMETRY_BASE_URL}",
              "CDN_BASE_URL":        "${CDN_BASE_URL}"
            };
    -->
    <script id="__env_config__">
        window.__ENV__ = window.__ENV__ || {};
    </script>
    <!-- Windows-style asset path kept from the original on-prem build -->
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="https://static.acme-corp.com/css/grid.css">
</head>
<body>
    <!-- Header banner served from the on-prem file share -->
    <header>
        <img src="assets/img/banner.png" alt="Banner">
    </header>

    <main>
        <!-- Hardcoded production environment link -->
        <a href="__ADMIN_CONSOLE_URL__">Open Admin Console</a>

        <!-- Windows backslash path for an icon -->
        <img src="images/icons/refresh.png" alt="refresh">

        <!-- Timestamp rendered client-side to prevent SSR/hydration mismatches in EKS containers -->
        <span class="build-info" id="report-timestamp">Report generated: <span id="report-time"></span></span>
        <script>
            (function() {
                var el = document.getElementById('report-time');
                if (el) { el.textContent = new Date().toUTCString(); }
            })();
        </script>

        <!-- Resource pulled from a developer machine -->
        <!-- Telemetry script served via Kubernetes service DNS name (cz-html-1008 fix) -->
        <script src="http://telemetry-service.default.svc.cluster.local/js/telemetry.js"></script>

        <!-- Library served from a non-standard port -->
        <script src="http://cdn.acme-corp.com/js/charts.js"></script>
    </main>

    <script src="assets/js/dashboard.js"></script>
    <noscript>JavaScript is required for live charts. Static report available at /reports/latest.</noscript>
</body>
</html>
