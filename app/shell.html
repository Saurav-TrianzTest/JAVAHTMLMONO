<!DOCTYPE html>
<!--
  Next.js SSR Shell — deployed on AKS (Azure Kubernetes Service)
  Secrets injected via Azure Key Vault CSI Driver (SecretProviderClass).
  Pod identity resolved through AKS Workload Identity (azure.workload.identity/use: "true").

  AKS Workload Identity annotations required on the ServiceAccount:
    azure.workload.identity/client-id: <AZURE_CLIENT_ID>
    azure.workload.identity/tenant-id: <AZURE_TENANT_ID>

  SecretProviderClass mounts Key Vault secrets as environment variables:
    APP_ENV, API_BASE_URL, NEXT_PUBLIC_APP_TITLE, BUILD_ID
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    SSR environment configuration injected by the Next.js Node.js server at request time.
    Values are sourced from environment variables populated by the AKS Key Vault CSI Driver.
    Example SecretProviderClass volume mount:
      env:
        - name: APP_ENV
          valueFrom:
            secretKeyRef:
              name: akv-secrets
              key: APP_ENV
        - name: NEXT_PUBLIC_APP_TITLE
          valueFrom:
            secretKeyRef:
              name: akv-secrets
              key: NEXT_PUBLIC_APP_TITLE
  -->
  <meta name="env-config" content="${APP_ENV}">
  <title>${NEXT_PUBLIC_APP_TITLE}</title>
  <!--
    __NEXT_DATA__ is the standard Next.js SSR data island.
    The Next.js Node.js server (running inside the AKS pod) serialises
    getServerSideProps / getStaticProps output here before sending the
    response, so the page is never blank on first paint.
  -->
  <script id="__NEXT_DATA__" type="application/json">
    {
      "props": {
        "pageProps": {
          "appEnv": "${APP_ENV}",
          "buildId": "${BUILD_ID}"
        }
      },
      "page": "/shell",
      "query": {},
      "buildId": "${BUILD_ID}",
      "runtimeConfig": {
        "apiBaseUrl": "${API_BASE_URL}"
      }
    }
  </script>
  <link rel="stylesheet" href="/_next/static/css/main.css">
</head>
<body>
  <!--
    #__next is the standard Next.js SSR root mount point.
    The Next.js server renders meaningful HTML here on the server side
    (inside the AKS pod) before the response is sent to the client,
    preventing blank pages during SSR pod operation.
    React hydration attaches to this pre-rendered markup on the client.
  -->
  <div id="__next">
    <!-- SSR-rendered application shell — populated by Next.js getServerSideProps -->
    <header role="banner">
      <nav aria-label="Primary navigation">
        <a href="/">Home</a>
      </nav>
    </header>
    <main id="main-content" role="main">
      <!-- Next.js page component output is injected here by the SSR Node.js server -->
      <h1>App Shell</h1>
      <p>Loading application…</p>
    </main>
    <footer role="contentinfo">
      <p>Acme Portal &mdash; served by Next.js SSR on AKS</p>
    </footer>
  </div>

  <!--
    Next.js client-side runtime chunks.
    These are served from the AKS pod's static asset path and hydrate
    the server-rendered markup above; they do NOT replace it.
  -->
  <script src="/_next/static/chunks/webpack.js" defer></script>
  <script src="/_next/static/chunks/main.js" defer></script>
  <noscript>
    This application requires JavaScript for full interactivity,
    but core content is server-rendered and visible without it.
  </noscript>
</body>
</html>
