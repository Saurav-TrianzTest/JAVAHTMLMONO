<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="env-config" content="">
  <title>App Shell</title>
  <script src="js/bundle.js"></script>
</head>
<body>
  <h1>App Shell</h1>
  <!-- SSR: server-rendered application shell for EKS/Kubernetes SSR pod compatibility -->
  <div id="root">
    <div id="ssr-shell" aria-live="polite">
      <header class="app-header" role="banner">
        <nav class="app-nav" role="navigation" aria-label="Main navigation">
          <a href="/" class="nav-brand">Acme Portal</a>
        </nav>
      </header>
      <main class="app-main" role="main" id="main-content">
        <section class="app-loading" aria-label="Application loading">
          <p>Loading application&hellip;</p>
        </section>
      </main>
      <footer class="app-footer" role="contentinfo">
        <p>&copy; Acme Portal</p>
      </footer>
    </div>
  </div>
  <script src="js/bundle.js"></script>
  <noscript>App requires JavaScript.</noscript>
</body>
</html>
