<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="env-config" content="">
  <title>Contact Us</title>
</head>
<body>
  <h1>Contact</h1>
  <form id="contact-form" action="__CONTACT_API_URL__" method="post">
    <input name="email" type="email">
    <button type="submit">Send</button>
  </form>
  <script>
    window.__ENV__ = window.__ENV__ || {};
    (function () {
      var form = document.getElementById('contact-form');
      if (form) {
        var apiUrl = (window.__ENV__ && window.__ENV__.CONTACT_API_URL)
          ? window.__ENV__.CONTACT_API_URL
          : (form.getAttribute('action') !== '__CONTACT_API_URL__'
              ? form.getAttribute('action')
              : '/api/contact/submit');
        form.setAttribute('action', apiUrl);
      }
    })();
  </script>
  <noscript>Email us directly at support@acme.example.</noscript>
</body>
</html>
