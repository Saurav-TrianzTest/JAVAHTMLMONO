version: "3.9"

services:
  acme-portal-static:
    build:
      context: .
      dockerfile: Dockerfile
    image: acme-portal-static:latest
    container_name: acme-portal-static
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=UTC
      - API_URL=${API_URL:-http://localhost:8080}
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'health check via tcp' && (echo > /dev/tcp/localhost/8080) 2>/dev/null && echo 'ok' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  app-network:
    driver: bridge
